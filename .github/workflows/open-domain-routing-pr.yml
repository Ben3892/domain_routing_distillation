name: Open domain routing experiment PR as GitHub Actions bot
on:
  push:
    branches:
      - codex/actions-domain-routing-pr
permissions:
  contents: write
  pull-requests: write
concurrency: domain-routing-pr-publisher
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open the PR from the tested tree
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repository = "Ben3892/domain_routing_distillation"
          base = "main"
          base_sha = "9a5346bb518e312990ea03d0db5263561da529d2"
          tree = "eeea1cc102de0ebd18f19cf810de25870d0db499"
          branch = "codex/domain-routing-experiment-launcher"
          title = "Add an experiment launcher and matched controls for domain routing"
          body = "## Changes\n\n- Add a CPU launcher and a reproducibility guide cross-referenced to the paper's experimental sections, tables, and evaluation protocol.\n- Cover LM and KD baselines, Top-k and temperature sweeps, domain routing, and the four published OTMass and Entropy thresholds.\n- Provide additional matched-budget fixed-mix and random-routing controls. Document the offline teacher cache and the prerequisites for Megatron GPU reproduction.\n\n## Validation\n\n- All five local regression tests and all 13 synthetic CPU settings in the paper matrix passed.\n- The original 11-setting control matrix remains available. GPU training and benchmark reproduction require the Megatron components, original checkpoint, and original data listed in the guide."
          bot = "github-actions[bot]"

          if os.environ["GITHUB_REPOSITORY"] != repository:
              raise SystemExit("Unexpected repository")

          root = "/repos/" + repository
          token = os.environ["GH_TOKEN"]

          def api(path, payload=None, method=None):
              request = Request(
                  "https://api.github.com" + root + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "domain-routing-pr-publisher",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  if error.code != 404:
                      print(f"GitHub HTTP {error.code} for {path}: {json.load(error).get('message', '')}", flush=True)
                  raise

          def check_commit(commit):
              parents = [parent["sha"] for parent in commit["parents"]]
              if commit["tree"]["sha"] != tree or parents != [base_sha]:
                  raise RuntimeError("Branch differs from the tested experiment changes")
              if not commit["author"]["email"].endswith(bot + "@users.noreply.github.com"):
                  raise RuntimeError("Unexpected commit author")

          sha = api("/git/ref/heads/" + branch)["object"]["sha"]
          if sha == base_sha:
              commit = api("/git/commits", {
                  "message": "Cover the paper experiments and evaluation protocol",
                  "tree": tree, "parents": [base_sha],
              })
              check_commit(commit)
              sha = commit["sha"]
              api("/git/refs/heads/" + branch, {"sha": sha, "force": False}, method="PATCH")
          else:
              check_commit(api("/git/commits/" + sha))

          query = urlencode({"head": repository.split("/")[0] + ":" + branch, "base": base, "state": "open"})
          matches = api("/pulls?" + query)
          pr = matches[0] if matches else api(
              "/pulls", {"title": title, "body": body, "head": branch, "base": base}
          )
          if (pr["user"]["login"], pr["head"]["sha"]) != (bot, sha):
              raise RuntimeError("Unexpected pull request author or head")
          print(pr["html_url"])
          PY
